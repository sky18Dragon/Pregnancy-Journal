[platformio]
default_envs = sticky-release

[env]
platform = espressif32@6.11.0
board = sticky_esp32s3
framework = espidf
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
board_build.partitions = partitions.csv

build_flags =
    -DSTICKY_FIRMWARE_VERSION=\"2.0.0\"

[env:sticky-debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -DSTICKY_BUILD_PROFILE=\"debug\"
    -DSTICKY_LOG_COMPILE_LEVEL=5
    -DSTICKY_LOG_BOOT_DETAILS_ENABLED=1
    -DSTICKY_LOG_POWER_DETAILS_ENABLED=1
    -DSTICKY_LOG_HEARTBEAT_ENABLED=1
    -DSTICKY_LOG_DISPLAY_TIMING_ENABLED=0
    -DSTICKY_LOG_TOUCH_SAMPLES_ENABLED=1
    -DSTICKY_LOG_TOUCH_DRIVER_OUTPUT_ENABLED=1
    -DSTICKY_LOG_MOTION_SAMPLES_ENABLED=0
    -DSTICKY_LOG_RTC_READS_ENABLED=0
    -DSTICKY_POWER_TEST_MODE=0
    -DSTICKY_LOG_TIMER_TICKS_ENABLED=0

[env:sticky-power-test]
build_type = debug
build_flags =
    ${env.build_flags}
    -DSTICKY_BUILD_PROFILE=\"power-test\"
    -DSTICKY_LOG_COMPILE_LEVEL=5
    -DSTICKY_LOG_BOOT_DETAILS_ENABLED=1
    -DSTICKY_LOG_POWER_DETAILS_ENABLED=1
    -DSTICKY_LOG_HEARTBEAT_ENABLED=1
    -DSTICKY_LOG_DISPLAY_TIMING_ENABLED=0
    -DSTICKY_LOG_TOUCH_SAMPLES_ENABLED=1
    -DSTICKY_LOG_TOUCH_DRIVER_OUTPUT_ENABLED=1
    -DSTICKY_LOG_MOTION_SAMPLES_ENABLED=0
    -DSTICKY_LOG_RTC_READS_ENABLED=0
    -DSTICKY_POWER_TEST_MODE=1
    -DSTICKY_LOG_TIMER_TICKS_ENABLED=0

[env:sticky-release]
build_type = release
; ESP-IDF ignores PlatformIO build_type: optimization, assertion and log
; ceilings come from this release-only sdkconfig overlay.
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release.defaults"
build_flags =
    ${env.build_flags}
    -DSTICKY_BUILD_PROFILE=\"release\"
    -DSTICKY_LOG_COMPILE_LEVEL=3
    -DSTICKY_LOG_BOOT_DETAILS_ENABLED=0
    -DSTICKY_LOG_POWER_DETAILS_ENABLED=0
    -DSTICKY_LOG_HEARTBEAT_ENABLED=0
    -DSTICKY_LOG_DISPLAY_TIMING_ENABLED=0
    -DSTICKY_LOG_TOUCH_SAMPLES_ENABLED=0
    -DSTICKY_LOG_TOUCH_DRIVER_OUTPUT_ENABLED=0
    -DSTICKY_LOG_MOTION_SAMPLES_ENABLED=0
    -DSTICKY_LOG_RTC_READS_ENABLED=0
    -DSTICKY_POWER_TEST_MODE=0
    -DSTICKY_LOG_TIMER_TICKS_ENABLED=0

[env:sticky-font-test]
extends = env:sticky-release
build_flags =
    ${env:sticky-release.build_flags}
    -DUI_DEBUG_FONT_TEST=1

[env:sticky-font-test-portrait]
extends = env:sticky-release
build_flags =
    ${env:sticky-release.build_flags}
    -DUI_DEBUG_FONT_TEST=1
    -DUI_DEBUG_FONT_TEST_PORTRAIT=1

[env:sticky-manifest-commit-test]
extends = env:sticky-debug
build_flags =
    ${env:sticky-debug.build_flags}
    -DSTICKY_MANIFEST_COMMIT_TEST=1

[env:sticky-journal-power-test]
extends = env:sticky-debug
build_flags =
    ${env:sticky-debug.build_flags}
    -DSTICKY_JOURNAL_POWER_TEST=1

[env:sticky-journal-partial-test]
extends = env:sticky-debug
build_flags =
    ${env:sticky-debug.build_flags}
    -DSTICKY_JOURNAL_POWER_TEST=1
    -DSTICKY_JOURNAL_PARTIAL_TEST=1

[env:sticky-object-power-test]
extends = env:sticky-debug
build_flags =
    ${env:sticky-debug.build_flags}
    -DSTICKY_OBJECT_POWER_TEST=1

[env:sticky-object-partial-test]
extends = env:sticky-debug
build_flags =
    ${env:sticky-debug.build_flags}
    -DSTICKY_OBJECT_POWER_TEST=1
    -DSTICKY_OBJECT_PARTIAL_TEST=1

[env:sticky-index-power-test]
extends = env:sticky-debug
build_flags =
    ${env:sticky-debug.build_flags}
    -DSTICKY_INDEX_POWER_TEST=1

[env:sticky-index-partial-test]
extends = env:sticky-debug
build_flags =
    ${env:sticky-debug.build_flags}
    -DSTICKY_INDEX_POWER_TEST=1
    -DSTICKY_INDEX_PARTIAL_TEST=1

[env:sticky-checkpoint-commit-test]
extends = env:sticky-debug
build_flags =
    ${env:sticky-debug.build_flags}
    -DSTICKY_CHECKPOINT_COMMIT_TEST=1

[env:sticky-storage-status-test]
extends = env:sticky-debug
build_flags =
    ${env:sticky-debug.build_flags}
    -DSTICKY_STORAGE_STATUS_TEST=1

[env:sticky-storage-read-only-test]
extends = env:sticky-storage-status-test
build_flags =
    ${env:sticky-storage-status-test.build_flags}
    -DSTICKY_SD_INJECT_READ_ONLY=1

[env:sticky-storage-full-test]
extends = env:sticky-storage-status-test
build_flags =
    ${env:sticky-storage-status-test.build_flags}
    -DSTICKY_SD_INJECT_FULL=1

[env:sticky-storage-unmount-fault-test]
extends = env:sticky-debug
build_flags =
    ${env:sticky-debug.build_flags}
    -DSTICKY_SD_INJECT_UNMOUNT_FAILURE_ONCE=1

[env:sticky-storage-mount-fault-test]
extends = env:sticky-debug
build_flags =
    ${env:sticky-debug.build_flags}
    -DSTICKY_SD_INJECT_MOUNT_FAILURE_ONCE=1
