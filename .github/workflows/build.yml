name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links
        run: python3 tools/check_markdown_links.py
      - name: Run host regression tests
        run: ./tools/run_host_tests.sh

  platformio:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - sticky-debug
          - sticky-power-test
          - sticky-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.1.18
      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}
